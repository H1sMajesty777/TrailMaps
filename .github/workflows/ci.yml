name: CI

on:
  push:            # every push to any branch
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install ruff==0.12.3
      - run: ruff check .

  test:
    name: Tests (pytest + PostGIS + Redis)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trailmaps
          POSTGRES_PASSWORD: trailmaps
          POSTGRES_DB: trailmaps_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailmaps -d trailmaps_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://trailmaps:trailmaps@localhost:5432/trailmaps_test
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests (migrations are applied by the test session itself)
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build + compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i 's/^HTTP_PORT=.*/HTTP_PORT=8080/' .env
      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Build backend image
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build backend
      - name: Start the stack (without OSRM)
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d postgres redis migrate backend nginx
      - name: Wait for readiness through nginx
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/api/health/ready; then echo; exit 0; fi
            sleep 2
          done
          echo "stack did not become ready" >&2
          exit 1
      - name: End-to-end smoke (register, login, me, tags)
        run: |
          set -euo pipefail
          base=http://localhost:8080/api
          curl -fsS -X POST $base/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","username":"smoke","password":"Passw0rd!x"}' > /dev/null
          token=$(curl -fsS -X POST $base/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"Passw0rd!x"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["access_token"])')
          curl -fsS $base/auth/me -H "Authorization: Bearer $token" | grep -q smoke@example.com
          curl -fsS $base/tags | grep -q "еда"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml down -v

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt

# Throw-away PostGIS + Redis for running the test-suite locally:
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && pytest
services:
  postgres-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: trailmaps
      POSTGRES_PASSWORD: trailmaps
      POSTGRES_DB: trailmaps_test
    ports: ["127.0.0.1:5432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailmaps -d trailmaps_test"]
      interval: 3s
      retries: 20
  redis-test:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
